name: haven_front
description: Haven — A safe, confidential space to report and address harassment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.0
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.PNG
    - assets/anchor.png
    - assets/anchorwhitemode.png
    - assets/svg_screen_1.svg
    - assets/svg_screen_2.svg
    - assets/svg_screen_3.svg
